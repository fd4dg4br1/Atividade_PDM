services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-financeira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestao_financeira
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_financeira"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./gestao-financeira-api
    container_name: gestao-financeira-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gestao_financeira?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./gestao-financeira-api:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"

volumes:
  postgres_data:
  api_node_modules:
